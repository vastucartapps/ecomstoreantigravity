networks:
  # Private network: postgres, redis, minio NEVER join the shared coolify network.
  # This prevents DNS collision with identically-named services from other Coolify
  # projects (e.g. two "postgres" containers resolving to random IPs) and removes
  # the IPv6 ULA round-robin issue that caused KnexTimeoutError.
  ecomstore-internal:
    driver: bridge
  # Coolify's shared proxy network — only backend and frontend join this so
  # Traefik can route HTTPS traffic to them.
  coolify:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    networks:
      ecomstore-internal:
        aliases:
          - ecomstore-postgres
    # Custom entrypoint: patches pg_hba.conf in the data volume on every startup,
    # then hands off to the official docker-entrypoint.sh. This ensures trust auth
    # for both IPv4 and IPv6 connections on every start — even on existing volumes.
    entrypoint:
      - "sh"
      - "-c"
      - |
        DATA=/var/lib/postgresql/data
        HBA=$DATA/pg_hba.conf
        if [ -f "$HBA" ]; then
          printf '%s\n' \
            'local   all  all               trust' \
            'host    all  all  127.0.0.1/32  trust' \
            'host    all  all  ::1/128       trust' \
            'host    all  all  0.0.0.0/0     trust' \
            'host    all  all  ::/0          trust' \
            'local   replication all              trust' \
            'host    replication all 0.0.0.0/0    trust' \
            'host    replication all ::/0          trust' \
            > "$HBA"
        fi
        exec docker-entrypoint.sh "$@"
      - "sh"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
      # For fresh-volume init: use trust so initdb writes a trust pg_hba.conf
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # shm_size prevents shared memory issues on heavy queries
    shm_size: 256m
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      ecomstore-internal:
        aliases:
          - ecomstore-redis
    # AOF persistence for crash recovery + memory cap
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    networks:
      ecomstore-internal:
        aliases:
          - ecomstore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"   # S3 API (9002 to avoid conflict with Medusa's 9000)
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the default bucket on startup
  minio-init:
    image: minio/mc:latest
    restart: "no"
    networks:
      - ecomstore-internal
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://ecomstore-minio:9000 minioadmin minioadmin;
      mc mb local/medusa-uploads --ignore-existing;
      mc anonymous set download local/medusa-uploads;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      ecomstore-internal:
        aliases:
          - ecomstore-backend
      coolify: {}  # Traefik proxies HTTPS to this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      - DATABASE_URL=postgres://medusa:medusa@ecomstore-postgres:5432/medusa?sslmode=disable
      - REDIS_URL=redis://ecomstore-redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-supersecret-change-in-production}
      - NODE_ENV=production
      # Node.js memory tuning — 2048MB headroom for nightly GMC/Meta full-syncs
      # (each iterates the full product catalog in 500-item batches) and burst
      # admin imports. Was 1024MB; OOM-killed during peak sync windows.
      - NODE_OPTIONS=--max-old-space-size=2048
      # CORS
      - STORE_CORS=${STORE_CORS:-https://store.vastucart.in,http://localhost:3000}
      - ADMIN_CORS=${ADMIN_CORS:-https://store.vastucart.in,http://localhost:3000,http://localhost:9000}
      - AUTH_CORS=${AUTH_CORS:-https://store.vastucart.in,http://localhost:3000,http://localhost:9000}
      # MinIO / S3
      - S3_FILE_URL=${S3_FILE_URL:-http://localhost:9002/medusa-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-medusa-uploads}
      - S3_ENDPOINT=http://ecomstore-minio:9000
      # Payments
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_ACCOUNT=${RAZORPAY_ACCOUNT:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_ENVIRONMENT=${PAYPAL_ENVIRONMENT:-sandbox}
      # Auth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      # Analytics
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
      - GA4_API_SECRET=${GA4_API_SECRET:-}
      # Search
      - ALGOLIA_APP_ID=${ALGOLIA_APP_ID:-}
      - ALGOLIA_API_KEY=${ALGOLIA_API_KEY:-}
      - ALGOLIA_PRODUCT_INDEX_NAME=${ALGOLIA_PRODUCT_INDEX_NAME:-products}
      # Email (disabled until Listmonk is re-enabled)
      - EMAIL_FROM=${EMAIL_FROM:-VastuCart <orders@vastucart.in>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Store / public URLs — BACKEND_URL is REQUIRED in production
      # (env-validation refuses to start without it). Used by GMC/Meta status
      # routes to build feed URLs and by the support-ticket emailer for the
      # admin deep link. Defaulted here so Coolify-managed deploys work
      # out-of-the-box; override via Coolify env vars for staging.
      - BACKEND_URL=${BACKEND_URL:-https://sapi.vastucart.in}
      - STORE_URL=${STORE_URL:-https://store.vastucart.in}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@vastucart.in}
      # Error monitoring (optional — no-ops when DSN missing)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN:-sapi.vastucart.in}`)"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=9000"
      - "traefik.docker.network=coolify"
    healthcheck:
      # Pure TCP probe — Medusa v2 doesn't expose /health by default, so the
      # prior `wget /health` check was guaranteed to fail with 404 even after
      # the server bound to 9000. The TCP check just confirms the port is
      # accepting connections, which is exactly what depends_on needs to know.
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(9000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1)); setTimeout(()=>process.exit(2),3000)\""]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY:-}
        - NEXT_PUBLIC_ALGOLIA_APP_ID=${ALGOLIA_APP_ID:-}
        - NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${ALGOLIA_SEARCH_KEY:-}
        - NEXT_PUBLIC_ALGOLIA_INDEX_NAME=${ALGOLIA_PRODUCT_INDEX_NAME:-products}
        - NEXT_PUBLIC_POSTHOG_KEY=${POSTHOG_API_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
        - NEXT_PUBLIC_GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
    restart: always
    networks:
      ecomstore-internal: {}  # reaches ecomstore-backend/ecomstore-minio
      coolify: {}             # Traefik proxies HTTPS to this
    depends_on:
      # service_started instead of service_healthy — frontend will queue
      # API calls behind a brief Medusa boot delay (handled by Next.js
      # rewrites + client retries), and this prevents the entire deploy
      # from failing when the backend healthcheck is slow / mis-probing.
      # Once we can read live container logs we can re-enable strict gating.
      backend:
        condition: service_started
    labels:
      # Traefik routing — Coolify's shared proxy needs explicit rule/entrypoints/tls
      # to terminate HTTPS for the storefront. Mirrors backend labels (lines 211-218).
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN:-store.vastucart.in}`)"
      - "traefik.http.routers.frontend.entrypoints=https"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - MEDUSA_INTERNAL_URL=http://ecomstore-backend:9000
      - S3_INTERNAL_URL=http://ecomstore-minio:9000
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${MEDUSA_PUBLISHABLE_KEY:-}
      - NEXT_PUBLIC_ALGOLIA_APP_ID=${ALGOLIA_APP_ID:-}
      - NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${ALGOLIA_SEARCH_KEY:-}
      - NEXT_PUBLIC_ALGOLIA_INDEX_NAME=${ALGOLIA_PRODUCT_INDEX_NAME:-products}
      - NEXT_PUBLIC_POSTHOG_KEY=${POSTHOG_API_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - NEXT_PUBLIC_GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    # Named volume — survives container rebuilds, redeploys, and restarts
    # Data is ONLY lost if you explicitly run: docker volume rm <volume_name>
  redis_data:
  minio_data:
