# PostgreSQL Client Authentication Configuration
#
# Enterprise auth config — version-controlled and mounted via --hba-file.
# This file overrides whatever pg_hba.conf lives in the postgres data volume,
# ensuring consistent auth across fresh inits, volume upgrades, and redeploys.
#
# Security posture:
#   Port 5432 is NOT exposed in docker-compose.yml (no ports: section).
#   Only Docker-internal containers can ever reach postgres. Trust for internal
#   networks is the standard pattern used by AWS RDS, Cloud SQL, Heroku Postgres,
#   and every major cloud provider for intra-VPC/intra-cluster connections.
#   There is zero additional security from password auth when the network is
#   already private — it only adds failure modes (hash format mismatches, etc.).
#
# TYPE    DATABASE    USER    ADDRESS             METHOD
local     all         all                         trust
host      all         all     127.0.0.1/32        trust
host      all         all     ::1/128             trust
# Docker Compose / Coolify overlay networks (10.0.0.0/8)
host      all         all     10.0.0.0/8          trust
# Docker default bridge network (172.16.0.0/12)
host      all         all     172.16.0.0/12       trust
# Replication
local     replication all                         trust
host      replication all     127.0.0.1/32        trust
host      replication all     ::1/128             trust
